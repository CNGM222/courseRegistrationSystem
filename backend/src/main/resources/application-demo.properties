spring.datasource.url=jdbc:h2:mem:course_demo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.session.jdbc.initialize-schema=always
app.ssn-key=synthetic-demo-key
app.billing.dispatch-enabled=false
app.catalog.source=mock
app.catalog.mock-file=classpath:demo-catalog.json
app.catalog.sync-enabled=true
app.demo-password=${DEMO_PASSWORD:demo-only-2026}
