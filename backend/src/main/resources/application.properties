spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/course_registration_system?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:GM222}
spring.datasource.password=${DB_PASSWORD:GM222}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
app.ssn-key=${SSN_KEY:}
app.billing.url=${BILLING_URL:}
app.billing.token=${BILLING_TOKEN:}
app.billing.dispatch-enabled=${BILLING_DISPATCH_ENABLED:true}
app.catalog.source=${CATALOG_SOURCE:mock}
app.catalog.mock-file=${CATALOG_MOCK_FILE:}
app.catalog.sync-enabled=${CATALOG_SYNC_ENABLED:false}
app.catalog.ttl-hours=${CATALOG_TTL_HOURS:24}
